worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 8080;

        # Generated at container startup by entrypoint.sh: either empty, or
        # `auth_basic ...; auth_basic_user_file ...;` if BASIC_AUTH_USER/PASS
        # are set. Applies to the whole site (frontend + VNC + control API).
        include /etc/nginx/auth.conf;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        # VNC framebuffer, bridged to WebSocket by websockify on :6080.
        location /websockify {
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 61s;
            proxy_send_timeout 61s;
        }

        # Restart/pause/resume/status, backed by control-server.py.
        location /api/ {
            proxy_pass http://127.0.0.1:8081/;
        }
    }
}
